[package]
name = "simulo-core"
version = "0.1.0"
edition = "2021"
description = "Cœur logique de SIMULO : modèle d'appareil, parsing ADB, capacités, machine à états de connexion, sessions QR. Zéro dépendance lourde, 100% testable."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "simulo_core"
