[package]
name = "simulo"
version = "0.1.0"
description = "SIMULO — Windows smartphone mirroring & control platform"
authors = ["Simulo"]
edition = "2021"

[lib]
name = "simulo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
simulo-core = { path = "../crates/simulo-core" }
simulo-desktop-core = { path = "../crates/simulo-desktop-core" }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
