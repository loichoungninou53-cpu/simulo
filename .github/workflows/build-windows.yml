name: Build Windows installer (.exe)

# Comment ça marche :
#  • Quand tu pousses une TAG qui commence par "v" (ex. v0.1.0) → le .exe est construit
#    sur un PC Windows de GitHub et attaché à la Release correspondante.
#  • Ou à la main : onglet "Actions" → "Build Windows installer" → "Run workflow".
# Une fois fait, le bouton "Télécharger" du site pointe vers cette Release : c'est le
# vrai SimuloSetup.exe (installateur NSIS FR/EN + version portable).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tauri-windows:
    name: Build .exe sur Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Installer les dépendances
        working-directory: app
        run: npm ci

      - name: Build Tauri (installateur NSIS + binaire portable)
        working-directory: app
        run: npm run build:win

      - name: Publier dans GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v0.1.0' }}
          generate_release_notes: true
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/simulo.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
